name: o pana e ante

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  o-pana-e-ante:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: o kama e ilo DNSControl
        uses: gacts/install-dnscontrol@f57e617cf52ee0c25df830201d9ada2ce69679f3 # v1.3.5
        with:
          version: v4.34.0

      - name: ilo DNSControl la o pana e ante
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          KULUPULA_PORKBUN_API_KEY: ${{ secrets.KULUPULA_PORKBUN_API_KEY }}
          KULUPULA_PORKBUN_SECRET_KEY: ${{ secrets.KULUPULA_PORKBUN_SECRET_KEY }}
        run: |
          dnscontrol push
